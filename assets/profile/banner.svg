<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Александр Никитин</title>
  <desc id="desc">Создаю веб-сервисы, ботов, Mini Apps и AI-продукты</desc>
  <style>
    .bg{fill:#f6f8fa}.surface{fill:#fff}.surface-2{fill:#eef2f5}.ink{fill:#101820}.muted{fill:#53606c}.line{stroke:#cbd5de}.strong-line{stroke:#101820}.accent{fill:#0a9b72}.accent-line{stroke:#0a9b72}.cyan{fill:#087fa0}.blue{fill:#0969da}.screen-text{fill:#27313a}
    .flow{animation:flow 4.8s ease-in-out infinite}.cursor{animation:cursor 1.1s steps(1) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.row-2{animation:row 4.8s ease-in-out infinite;animation-delay:.35s}.row-3{animation:row 4.8s ease-in-out infinite;animation-delay:.7s}
    @keyframes flow{0%,14%{transform:translateX(-110px);opacity:0}25%,72%{opacity:1}86%,100%{transform:translateX(350px);opacity:0}}
    @keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes row{0%,18%{opacity:.25}28%,82%{opacity:1}92%,100%{opacity:.25}}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117}.surface{fill:#161b22}.surface-2{fill:#21262d}.ink{fill:#f0f6fc}.muted{fill:#9da7b1}.line{stroke:#30363d}.strong-line{stroke:#8b949e}.accent{fill:#3fb98c}.accent-line{stroke:#3fb98c}.cyan{fill:#39b6d4}.blue{fill:#58a6ff}.screen-text{fill:#c9d1d9}}
    @media (prefers-reduced-motion:reduce){.flow,.cursor,.pulse,.row-2,.row-3{animation:none}}
  </style>
  <rect class="bg" width="1280" height="360"/>
  <path class="line" d="M0 321H1280" opacity=".6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text class="ink" x="54" y="100" font-size="58" font-weight="750">Александр Никитин</text>
    <text class="muted" x="58" y="151" font-size="25">Собираю цифровые продукты с помощью AI</text>
    <text class="ink" x="58" y="220" font-size="16" font-weight="700" letter-spacing="2.2">WEB SERVICES   /   BOTS   /   MINI APPS   /   AI</text>
    <g transform="translate(58 268)" font-size="14" font-weight="650">
      <text class="muted" x="0" y="0">ЗАДАЧА</text><text class="muted" x="124" y="0">СЦЕНАРИЙ</text><text class="muted" x="275" y="0">ПРОДУКТ</text><text class="accent" x="409" y="0">ЗАПУСК</text>
      <path class="line" d="M0 24H472" stroke-width="2"/>
      <path class="accent-line flow" d="M0 24H110" stroke-width="4"/>
      <rect class="accent pulse" x="468" y="19" width="10" height="10" rx="2"/>
    </g>
  </g>
  <g transform="translate(765 34)">
    <rect class="surface strong-line" x="0" y="0" width="465" height="278" rx="10" stroke-width="1.5"/>
    <path class="line" d="M0 43H465M124 43V278"/>
    <circle cx="22" cy="22" r="5" fill="#ff6b5f"/><circle cx="40" cy="22" r="5" fill="#e3b341"/><circle cx="58" cy="22" r="5" fill="#3fb950"/>
    <rect class="surface-2" x="82" y="14" width="202" height="16" rx="4"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text class="muted" x="18" y="73" font-size="11" font-weight="700" letter-spacing="1.2">ПРОЕКТ</text>
      <rect class="surface-2" x="14" y="88" width="96" height="34" rx="5"/>
      <rect class="accent" x="18" y="94" width="4" height="22" rx="2"/>
      <text class="screen-text" x="31" y="110" font-size="12" font-weight="650">Интерфейс</text>
      <text class="muted" x="30" y="147" font-size="12">Сценарии</text><text class="muted" x="30" y="178" font-size="12">Данные</text><text class="muted" x="30" y="209" font-size="12">Интеграции</text><text class="muted" x="30" y="240" font-size="12">Проверки</text>
      <text class="ink" x="148" y="77" font-size="15" font-weight="700">Рабочая сборка</text>
      <rect class="surface-2" x="148" y="94" width="284" height="48" rx="6"/>
      <rect class="blue" x="162" y="108" width="82" height="7" rx="3"/><rect class="line" x="162" y="123" width="190" height="5" rx="2"/>
      <rect class="accent" x="380" y="106" width="38" height="18" rx="9"/><text fill="#fff" x="391" y="119" font-size="9" font-weight="700">LIVE</text>
      <g class="row-2"><rect class="surface-2" x="148" y="154" width="136" height="84" rx="6"/><text class="muted" x="162" y="176" font-size="10">Сценарии</text><text class="ink" x="162" y="207" font-size="26" font-weight="750">12</text><path class="accent-line" d="M209 210l15-13 13 7 20-23" fill="none" stroke-width="3"/></g>
      <g class="row-3"><rect class="surface-2" x="296" y="154" width="136" height="84" rx="6"/><text class="muted" x="310" y="176" font-size="10">Проверки</text><path class="line" d="M311 195H412M311 214H392" stroke-width="7"/><path class="accent-line" d="M311 195H390M311 214H375" stroke-width="7"/></g>
      <text class="muted" x="148" y="263" font-size="11">idea / logic / interface / release</text><rect class="accent cursor" x="350" y="252" width="7" height="13"/>
    </g>
  </g>
</svg>
