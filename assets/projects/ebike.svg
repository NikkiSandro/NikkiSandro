<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">e-bike</title><desc id="desc">Telegram Mini App для записи на ремонт</desc>
  <style>.bg{fill:#f6f8fa}.surface{fill:#fff}.panel{fill:#eef2f5}.ink{fill:#171b20}.muted{fill:#606a73}.line{stroke:#c8d1da}.accent{fill:#e05a18}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.surface{fill:#161b22}.panel{fill:#21262d}.ink{fill:#f0f6fc}.muted{fill:#9da7b1}.line{stroke:#30363d}.accent{fill:#ff7b36}}</style>
  <rect class="bg" width="560" height="280"/>
