<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">Рекомендательная система</title><desc id="desc">Подбор предложений по данным и бизнес-правилам</desc>
  <style>.bg{fill:#f6f8fa}.surface{fill:#fff}.panel{fill:#eef2f5}.ink{fill:#131a22}.muted{fill:#5e6974}.line{stroke:#c8d1da}.accent{fill:#0969da}.good{fill:#0a9b72}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.surface{fill:#161b22}.panel{fill:#21262d}.ink{fill:#f0f6fc}.muted{fill:#9da7b1}.line{stroke:#30363d}.accent{fill:#58a6ff}.good{fill:#3fb98c}}</style>
  <rect class="bg" width="560" height="280"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text class="accent" x="28" y="42" font-size="12" font-weight="750" letter-spacing="1.5">DATA PRODUCT</text>
    <text class="ink" x="28" y="82" font-size="29" font-weight="750">Рекомендательная</text><text class="ink" x="28" y="117" font-size="29" font-weight="750">система</text>
    <text class="muted" x="28" y="160" font-size="14">Ранжирует предложения</text><text class="muted" x="28" y="181" font-size="14">по данным и правилам бизнеса</text>
    <text class="good" x="28" y="237" font-size="13" font-weight="700">Результат: готовая подборка</text>
  </g>
  <g transform="translate(297 20)">
    <rect class="surface line" width="230" height="240" rx="10" stroke-width="1.5"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text class="ink" x="17" y="31" font-size="12" font-weight="700">Рекомендации</text><text class="muted" x="177" y="31" font-size="9">SCORE</text>
      <g transform="translate(14 48)"><rect class="panel" width="202" height="48" rx="6"/><text class="accent" x="12" y="21" font-size="11" font-weight="750">01</text><text class="ink" x="39" y="21" font-size="10" font-weight="650">Предложение A</text><rect class="line" x="39" y="30" width="112" height="5" rx="2"/><rect class="good" x="39" y="30" width="101" height="5" rx="2"/><text class="good" x="166" y="24" font-size="11" font-weight="750">92%</text></g>
      <g transform="translate(14 105)"><rect class="panel" width="202" height="48" rx="6"/><text class="muted" x="12" y="21" font-size="11" font-weight="750">02</text><text class="ink" x="39" y="21" font-size="10" font-weight="650">Предложение B</text><rect class="line" x="39" y="30" width="112" height="5" rx="2"/><rect class="accent" x="39" y="30" width="82" height="5" rx="2"/><text class="accent" x="166" y="24" font-size="11" font-weight="750">78%</text></g>
      <g transform="translate(14 162)"><rect class="panel" width="202" height="48" rx="6"/><text class="muted" x="12" y="21" font-size="11" font-weight="750">03</text><text class="ink" x="39" y="21" font-size="10" font-weight="650">Предложение C</text><rect class="line" x="39" y="30" width="112" height="5" rx="2"/><rect class="accent" x="39" y="30" width="64" height="5" rx="2" opacity=".65"/><text class="muted" x="166" y="24" font-size="11" font-weight="750">61%</text></g>
      <text class="muted" x="14" y="227" font-size="9">Обновлено по новым данным</text><rect class="good" x="202" y="219" width="8" height="8" rx="4"/>
    </g>
  </g>
</svg>
