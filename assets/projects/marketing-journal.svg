<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">Маркетинговый журнал</title><desc id="desc">Веб-инструмент для учета маркетинговых активностей</desc>
  <style>.bg{fill:#f6f8fa}.surface{fill:#fff}.panel{fill:#eef2f5}.ink{fill:#1c1917}.muted{fill:#6b625d}.line{stroke:#d1c9c4}.accent{fill:#c4512d}.yellow{fill:#d9a51c}.green{fill:#17856d}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.surface{fill:#161b22}.panel{fill:#21262d}.ink{fill:#f0f6fc}.muted{fill:#a9a19b}.line{stroke:#37312e}.accent{fill:#f08058}.yellow{fill:#e3b341}.green{fill:#3fb98c}}</style>
  <rect class="bg" width="560" height="280"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text class="accent" x="28" y="42" font-size="12" font-weight="750" letter-spacing="1.5">INTERNAL WEB TOOL</text>
    <text class="ink" x="28" y="82" font-size="28" font-weight="750">Маркетинговый</text><text class="ink" x="28" y="116" font-size="28" font-weight="750">журнал</text>
    <text class="muted" x="28" y="160" font-size="14">Кампании, сроки и ответственные</text><text class="muted" x="28" y="181" font-size="14">в одном рабочем календаре</text>
    <text class="accent" x="28" y="237" font-size="13" font-weight="700">Планирование без таблиц</text>
  </g>
  <g transform="translate(286 22)">
    <rect class="surface line" width="244" height="236" rx="10" stroke-width="1.5"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text class="ink" x="16" y="29" font-size="12" font-weight="700">Август</text><text class="muted" x="185" y="29" font-size="9">4 активности</text>
      <path class="line" d="M0 43H244M47 43V219M86 43V219M125 43V219M164 43V219M203 43V219M8 76H236M8 109H236M8 142H236M8 175H236M8 208H236"/>
      <g class="muted" font-size="8" text-anchor="middle"><text x="27" y="59">ПН</text><text x="66" y="59">ВТ</text><text x="105" y="59">СР</text><text x="144" y="59">ЧТ</text><text x="183" y="59">ПТ</text><text x="222" y="59">СБ</text></g>
      <g class="muted" font-size="8"><text x="14" y="88">3</text><text x="53" y="88">4</text><text x="92" y="88">5</text><text x="131" y="88">6</text><text x="170" y="88">7</text><text x="209" y="88">8</text><text x="14" y="121">10</text><text x="53" y="121">11</text><text x="92" y="121">12</text><text x="131" y="121">13</text><text x="170" y="121">14</text><text x="209" y="121">15</text></g>
      <rect class="accent" x="55" y="92" width="65" height="12" rx="4"/><text fill="#fff" x="61" y="101" font-size="7">Рассылка</text>
      <rect class="yellow" x="94" y="125" width="96" height="12" rx="4"/><text fill="#fff" x="100" y="134" font-size="7">Промо-кампания</text>
      <rect class="green" x="133" y="158" width="72" height="12" rx="4"/><text fill="#fff" x="139" y="167" font-size="7">Публикация</text>
      <rect class="panel" x="15" y="221" width="104" height="8" rx="4"/><rect class="panel" x="128" y="221" width="52" height="8" rx="4"/>
    </g>
  </g>
